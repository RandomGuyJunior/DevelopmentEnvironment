name: Epic Bastion V5 Connected Cannons
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-epic-bastion-v5.yml"
      - "tools/build_epic_bastion_v5.py"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and renderer
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgl1-mesa-dri xvfb
      - name: Convert original Epic Bastion
        run: xvfb-run -a blender --background --python tools/import_epic_bastion_blender.py
      - name: Apply source script pose
        run: xvfb-run -a blender --background --python tools/pose_epic_bastion_blender.py
      - name: Generate V4 Legion armor base
        run: xvfb-run -a blender --background --python tools/build_epic_bastion_legion_armor.py
      - name: Engineer V5 integrated mounts and render
        run: |
          xvfb-run -a blender --background --python tools/build_epic_bastion_v5.py
          test -s epic_bastion_v5_connected.blend
          test -s epic_bastion_v5_connected.glb
          test -s epic_bastion_v5_connected.png
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: epic-bastion-v5-integrated
          path: |
            epic_bastion_v5_connected.blend
            epic_bastion_v5_connected.glb
            epic_bastion_v5_connected.png
